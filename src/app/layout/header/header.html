<header class="header">
  <div class="header__bar">
    <a class="header__brand" href="#home" (click)="closeMenu()">Prabhath Kumar</a>

    <div class="header__right">
      <nav class="header__nav" [class.header__nav--open]="menuOpen()">
        <a href="#about" (click)="closeMenu()" [class.is-active]="active() === 'about'" [attr.aria-current]="active() === 'about' ? 'location' : null">About</a>
        <a href="#experience" (click)="closeMenu()" [class.is-active]="active() === 'experience'" [attr.aria-current]="active() === 'experience' ? 'location' : null">Experience</a>
        <a href="#projects" (click)="closeMenu()" [class.is-active]="active() === 'projects'" [attr.aria-current]="active() === 'projects' ? 'location' : null">Projects</a>
        <a href="#contact" (click)="closeMenu()" [class.is-active]="active() === 'contact'" [attr.aria-current]="active() === 'contact' ? 'location' : null">Contact</a>
        <a class="header__resume" href="resume.pdf" download="Prabhath Kumar's Resume.pdf">Resume</a>
      </nav>

      <div class="header__controls">
        <button
          class="header__theme-toggle"
          type="button"
          (click)="toggleTheme()"
          [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          {{ themeService.theme() === 'dark' ? '☀' : '☾' }}
        </button>

        <button
          class="header__menu-btn"
          type="button"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen()"
          aria-label="Toggle navigation menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </div>
</header>
