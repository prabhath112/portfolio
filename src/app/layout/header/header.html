<header class="header">
  <div class="header__bar">
    <a class="header__brand" routerLink="/" (click)="closeMenu()">Prabhath Kumar</a>

    <button
      class="header__menu-btn"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="header__nav" [class.header__nav--open]="menuOpen()">
      <a routerLink="/about" routerLinkActive="is-active" (click)="closeMenu()">About</a>
      <a routerLink="/experience" routerLinkActive="is-active" (click)="closeMenu()">Experience</a>
      <a routerLink="/projects" routerLinkActive="is-active" (click)="closeMenu()">Projects</a>
      <a routerLink="/contact" routerLinkActive="is-active" (click)="closeMenu()">Contact</a>
      <a class="header__resume" href="resume.pdf" download>Resume</a>

      <button
        class="header__theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        {{ themeService.theme() === 'dark' ? '☀' : '☾' }}
      </button>
    </nav>
  </div>
</header>
