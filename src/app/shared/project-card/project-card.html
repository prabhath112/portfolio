<article class="card">
  <h3>{{ project().name }}</h3>

  <div class="card__body">
    <p>{{ project().description }}</p>

    <ul class="card__highlights">
      @for (item of project().highlights; track item) {
        <li>{{ item }}</li>
      }
    </ul>

    <ul class="card__tech">
      @for (tech of project().tech; track tech) {
        <li>{{ tech }}</li>
      }
    </ul>

    @if (project().link) {
      <a class="card__link" [href]="project().link" target="_blank" rel="noopener">View on GitHub</a>
    }
  </div>
</article>
