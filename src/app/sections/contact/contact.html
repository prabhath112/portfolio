<section class="page contact" id="contact">
  <h2>Let's talk</h2>
  <p>I'm open to new opportunities. Email is the quickest way to reach me.</p>

  <p class="contact__email">
    <a [href]="'mailto:' + links.email">{{ links.email }}</a>
    <button type="button" class="contact__copy" (click)="copyEmail()">
      {{ copied() ? 'Copied' : 'Copy email' }}
    </button>
  </p>

  <ul class="contact__list">
    <li>
      <span class="contact__label">LinkedIn</span>
      <a [href]="links.linkedin" target="_blank" rel="noopener">linkedin.com/in/prabhath007</a>
    </li>
    <li>
      <span class="contact__label">GitHub</span>
      <a [href]="links.github" target="_blank" rel="noopener">github.com/prabhath112</a>
    </li>
    <li>
      <span class="contact__label">Resume</span>
      <a href="resume.pdf" download="Prabhath Kumar's Resume.pdf">Download PDF</a>
    </li>
  </ul>
</section>
