name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Analytics ID lives in a repository variable, not in the source tree.
      - name: Inject Analytics measurement ID
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          if [ -n "$GA_MEASUREMENT_ID" ]; then
            echo "$GA_MEASUREMENT_ID" | grep -Eq '^G-[A-Z0-9]+$' || { echo "GA_MEASUREMENT_ID is malformed"; exit 1; }
            printf "export const analytics = { measurementId: '%s' };\n" "$GA_MEASUREMENT_ID" > src/content/analytics.ts
          fi

      - name: Build (static, prerendered)
        run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Second copy on the Oracle VM (https://rebirth007.duckdns.org), served from the
  # site root, so it is built with base href "/" instead of "/portfolio/".
  # The deploy key is restricted on the VM to a single command that replaces the
  # site files; it cannot open a shell.
  deploy-vm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check deploy secrets
        id: check
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          if [ -z "$VM_HOST" ]; then echo "VM secrets not set, skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - if: steps.check.outputs.skip != 'true'
        name: Install dependencies
        run: npm ci

      - if: steps.check.outputs.skip != 'true'
        name: Build for root hosting (same script Vercel runs)
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: sh scripts/build-root.sh

      - if: steps.check.outputs.skip != 'true'
        name: Upload to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_DEPLOY_KEY: ${{ secrets.VM_DEPLOY_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_DEPLOY_KEY" > ~/.ssh/vm_deploy && chmod 600 ~/.ssh/vm_deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -C dist/portfolio/browser -cf - . | ssh -i ~/.ssh/vm_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 "ubuntu@$VM_HOST"
          rm -f ~/.ssh/vm_deploy
