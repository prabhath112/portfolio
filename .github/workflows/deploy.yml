name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Analytics ID and contact-form config live in repository variables, not in the source tree.
      - name: Inject build config
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: sh scripts/inject-config.sh

      - name: Build (static, prerendered)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Vercel builds this commit itself (Git integration) and reports a "Vercel" commit
  # status, not a GitHub deployment. This job waits for that status and records it as
  # the "vercel" environment, so all three hosts appear under Deployments.
  vercel:
    runs-on: ubuntu-latest
    environment:
      name: vercel
      url: https://prabhathkumar.vercel.app
    permissions:
      statuses: read
    steps:
      - name: Wait for the Vercel production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            state=$(gh api "repos/$REPO/commits/$SHA/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')
            case "$state" in
              success) echo "Vercel deployed $SHA"; exit 0 ;;
              failure|error) echo "Vercel deployment $state"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Vercel (last state: $state)"; exit 1

  # Second copy on the Oracle VM (https://rebirth007.duckdns.org), served from the
  # site root, so it is built with base href "/" instead of "/portfolio/".
  # The deploy key is restricted on the VM to a single command that replaces the
  # site files; it cannot open a shell.
  deploy-vm:
    runs-on: ubuntu-latest
    # Shows up under "Deployments" on the repo page next to github-pages and Vercel.
    environment:
      name: oracle-vm
      url: https://rebirth007.duckdns.org
    permissions:
      contents: read
    steps:
      - name: Check deploy secrets
        id: check
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          if [ -z "$VM_HOST" ]; then echo "VM secrets not set, skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - if: steps.check.outputs.skip != 'true'
        name: Install dependencies
        run: npm ci

      - if: steps.check.outputs.skip != 'true'
        name: Build for root hosting (same script Vercel runs)
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: sh scripts/build-root.sh

      - if: steps.check.outputs.skip != 'true'
        name: Upload to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_DEPLOY_KEY: ${{ secrets.VM_DEPLOY_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_DEPLOY_KEY" > ~/.ssh/vm_deploy && chmod 600 ~/.ssh/vm_deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -C dist/portfolio/browser -cf - . | ssh -i ~/.ssh/vm_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 "ubuntu@$VM_HOST"
          rm -f ~/.ssh/vm_deploy
