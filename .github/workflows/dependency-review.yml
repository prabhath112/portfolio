name: Dependency review

# Runs on every pull request. A PR that adds or updates a dependency with a known vulnerability, at any
# severity and in any scope, fails this check. The "Security gates" repository ruleset requires it, with no
# bypass, so such a PR cannot merge until the dependency is fixed or removed.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # lets the action post its summary comment when it fails
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: on-failure
